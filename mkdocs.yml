site_name: Zommi
site_description: Visual context for AI agents. Share screenshots, annotations and available browser context with your existing agent.
site_url: https://timctho.github.io/zommi/
repo_url: https://github.com/timctho/zommi
repo_name: timctho/zommi
edit_uri: edit/main/docs/
theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true
  custom_dir: docs/theme
  navigation_depth: 3
plugins:
  - search
hooks:
  - scripts/docs_hooks.py
markdown_extensions:
  - attr_list
  - admonition
  - toc:
      permalink: true
extra_css:
  - assets/site.css
exclude_docs: |
  demos/README.md
  assets/README.md
  theme/
nav:
  - Home: index.md
  - Get started:
      - Install Zommi: install.md
      - Use Claude Code: guides/claude-code.md
      - Connect Chrome and Edge: guides/chrome-edge.md
      - Ubuntu Wayland: guides/ubuntu-wayland.md
  - Reference:
      - Capture and limitations: browser-context.md
      - Runtime commands: runtime-commands.md
      - Components and local state: desktop-reference.md
      - Codex history recovery: codex-history-repair.md
  - Project:
      - Contributing: contributing.md
      - Coding agent guide: agent-guide.md
      - Privacy: privacy.md
      - Security: security.md
      - Code signing policy: code-signing.md
      - Releases: public-releases.md
      - Windows acceptance: windows-acceptance.md
      - macOS testing: macos-testing.md
      - Ubuntu testing: ubuntu-testing.md
validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
