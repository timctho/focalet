name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and Release build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, zommi-ci]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy,rustfmt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 8.0.x

      - name: Check Rust core
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo build --workspace --bins

      - name: Restore Flutter dependencies
        working-directory: src/Zommi.Flutter
        run: flutter pub get

      - name: Analyze and test Flutter UI
        working-directory: src/Zommi.Flutter
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Restore Electron dependencies
        working-directory: src/Zommi.Electron
        run: npm ci

      - name: Run Electron tests
        working-directory: src/Zommi.Electron
        run: npm test

      - name: Restore .NET dependencies
        run: dotnet restore Zommi.sln

      - name: Run managed tests
        run: dotnet run --project tests/Zommi.Tests/Zommi.Tests.csproj --configuration Release --no-restore

      - name: Build .NET solution
        run: dotnet build Zommi.sln --configuration Release --no-restore

  windows-release:
    name: Windows release package
    needs: test
    runs-on: [self-hosted, Linux, X64, zommi-ci]
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 8.0.x

      - name: Build portable Windows release
        shell: bash
        run: |
          windows_script="$(wslpath -w "$GITHUB_WORKSPACE/scripts/package-windows.ps1")"
          /init '/mnt/c/Program Files/PowerShell/7/pwsh.exe' \
            -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass \
            -File "$windows_script" -Runtime win-x64

      - name: Verify release package
        shell: bash
        run: |
          archive='artifacts/zommi-win-x64.zip'
          package='artifacts/zommi-win-x64'
          required=(
            "$package/Zommi.exe"
            "$package/resources/native/Zommi.exe"
            "$package/resources/native/Zommi.Hook.exe"
            "$package/SHA256SUMS.txt"
          )
          for required_path in "${required[@]}"; do
            test -f "$required_path" || { echo "Release package is missing $required_path" >&2; exit 1; }
          done
          test -f "$archive" || { echo "Release archive is missing $archive" >&2; exit 1; }
          (cd artifacts && sha256sum zommi-win-x64.zip > zommi-win-x64.zip.sha256)
          ls -lh "$archive" "${archive}.sha256"

      - name: Upload Windows release
        uses: actions/upload-artifact@v7
        with:
          name: zommi-win-x64-${{ github.sha }}
          path: |
            artifacts/zommi-win-x64.zip
            artifacts/zommi-win-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
