name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      windows_interactive:
        description: Run the full Windows desktop shortcut and capture gate
        required: false
        default: false
        type: boolean
      windows_deploy_downloads:
        description: Atomically deploy the verified Windows package to Downloads
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Flutter and Rust contracts
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, zommi-ci]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy,rustfmt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Set up .NET capture build
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 8.0.x

      - name: Check Rust core
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo build --workspace --bins

      - name: Restore Flutter dependencies
        working-directory: src/Zommi.Flutter
        run: flutter pub get

      - name: Analyze and test Flutter UI
        working-directory: src/Zommi.Flutter
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Test release package contracts
        run: |
          node --check scripts/zommi-wsl-relay.js
          node --test tests/wsl_relay.test.mjs
          python3 -m py_compile scripts/assemble_release.py scripts/verify_release.py tests/test_release_package.py
          python3 tests/test_release_package.py -v
          python3 tests/test_linux_startup_smoke.py -v
          bash -n scripts/package-unix.sh scripts/package-linux-self-hosted.sh scripts/smoke-linux-release.sh

      - name: Build Windows capture helper
        run: |
          dotnet run --project tests/Zommi.Capture.Tests/Zommi.Capture.Tests.csproj --configuration Release
          dotnet build src/Zommi.Windows/Zommi.Windows.csproj --configuration Release

  release_linux:
    name: Native release (linux)
    needs: test
    runs-on: [self-hosted, Linux, X64, zommi-release]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Build and verify Linux release
        env:
          ZOMMI_LINUX_STARTUP_SMOKE: '1'
        run: bash scripts/package-linux-self-hosted.sh

      - name: Accept Linux X11 shortcuts and capture UX
        run: >-
          xvfb-run -a -s "-screen 0 1280x960x24 +extension GLX +render -noreset"
          python3 scripts/accept-linux-x11.py artifacts/zommi-linux-x64

      - name: Show release identity and signing state
        run: |
          python -c "import glob,json; p=glob.glob('artifacts/zommi-*/release-manifest.json'); assert len(p)==1, p; print(json.dumps(json.load(open(p[0], encoding='utf-8')), indent=2))"

      - name: Upload native release
        if: github.event_name != 'pull_request'
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_deploy_downloads }}
        uses: actions/upload-artifact@v7
        with:
          name: zommi-linux-${{ runner.arch }}-${{ github.sha }}
          path: |
            artifacts/zommi-linux-*.tar.gz
            artifacts/zommi-linux-*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release_windows:
    name: Native release (windows)
    needs: test
    runs-on: [self-hosted, Windows, X64, zommi-release]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Select local Windows build tools
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.ATL -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($installPath)) { throw 'An ATL-capable Visual Studio instance was not found.' }
          $gitBash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) { throw 'Git for Windows bash was not found.' }
          $jqDirectory = Join-Path $env:RUNNER_TOOL_CACHE 'jq\1.8.1\x64'
          $jq = Join-Path $jqDirectory 'jq.exe'
          $jqHash = '23cb60a1354eed6bcc8d9b9735e8c7b388cd1fdcb75726b93bc299ef22dd9334'
          if (-not (Test-Path -LiteralPath $jq -PathType Leaf)) {
            New-Item -ItemType Directory -Path $jqDirectory -Force | Out-Null
            $download = "$jq.download"
            Invoke-WebRequest -UseBasicParsing -Uri 'https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-windows-amd64.exe' -OutFile $download
            if ((Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne $jqHash) { throw 'jq download hash mismatch.' }
            Move-Item -LiteralPath $download -Destination $jq
          }
          if ((Get-FileHash -LiteralPath $jq -Algorithm SHA256).Hash.ToLowerInvariant() -ne $jqHash) { throw 'Cached jq hash mismatch.' }
          'CMAKE_GENERATOR=Visual Studio 17 2022' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_GENERATOR_INSTANCE=$installPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $gitBash) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $jqDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify local Python
        shell: pwsh
        run: python -c "import sys; assert sys.version_info >= (3, 10), sys.version; print(sys.version)"

      - name: Test Windows deployment lock retry
        shell: pwsh
        run: ./scripts/test-windows-deployment-helpers.ps1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          # The self-hosted runner's tool cache is durable. Uploading a second
          # multi-gigabyte GitHub cache makes the post-job slower than the build.
          cache: false

      - name: Verify local .NET capture publisher
        shell: pwsh
        run: |
          $sdks = @(dotnet --list-sdks)
          if ($LASTEXITCODE -ne 0 -or -not ($sdks -match '^8\.')) { throw ".NET 8 SDK was not found: $($sdks -join ', ')" }
          $sdks

      - name: Build and verify Windows release
        shell: pwsh
        env:
          ZOMMI_WINDOWS_SIGNING_THUMBPRINT: ${{ secrets.ZOMMI_WINDOWS_SIGNING_THUMBPRINT }}
        run: ./scripts/package-windows.ps1 -Runtime win-x64

      - name: Accept Windows non-visual capture contracts
        shell: pwsh
        run: ./scripts/accept-windows-capture.ps1 -PackageDirectory ./artifacts/zommi-windows-x64 -NonVisualOnly

      - name: Accept Windows shortcuts and capture UX
        if: github.event_name == 'workflow_dispatch' && inputs.windows_interactive
        shell: pwsh
        run: ./scripts/accept-windows-capture.ps1 -PackageDirectory ./artifacts/zommi-windows-x64

      - name: Accept retained-frame Windows size controls
        if: github.event_name == 'workflow_dispatch' && inputs.windows_interactive
        shell: powershell
        run: ./scripts/accept-windows-window-size.ps1 -PackageDirectory ./artifacts/zommi-windows-x64 -ExpectedCommit '${{ github.sha }}' -CaptureBackend Gdi

      - name: Show release identity and signing state
        shell: bash
        run: |
          python -c "import glob,json; p=glob.glob('artifacts/zommi-*/release-manifest.json'); assert len(p)==1, p; print(json.dumps(json.load(open(p[0], encoding='utf-8')), indent=2))"

      - name: Upload native release
        if: github.event_name != 'pull_request'
        continue-on-error: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_deploy_downloads }}
        uses: actions/upload-artifact@v7
        with:
          name: zommi-windows-${{ runner.arch }}-${{ github.sha }}
          path: |
            artifacts/zommi-windows-*.zip
            artifacts/zommi-windows-*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Deploy verified Windows release to Downloads
        if: github.event_name == 'workflow_dispatch' && inputs.windows_deploy_downloads
        shell: pwsh
        run: ./scripts/deploy-windows-downloads.ps1 -Runtime win-x64

  verify_windows_deployment:
    name: Verify deployed Windows process
    needs: release_windows
    if: github.event_name == 'workflow_dispatch' && inputs.windows_deploy_downloads
    runs-on: [self-hosted, Windows, X64, zommi-release]
    timeout-minutes: 5
    steps:
      - name: Verify exact deployed revision and delayed process health
        shell: pwsh
        run: |
          Start-Sleep -Seconds 5
          $targetDirectory = Join-Path $env:USERPROFILE 'Downloads/zommi-windows-x64'
          $targetExecutable = Join-Path $targetDirectory 'Zommi.exe'
          $manifest = Get-Content -LiteralPath (Join-Path $targetDirectory 'release-manifest.json') -Raw | ConvertFrom-Json
          if ($manifest.gitCommit -ne '${{ github.sha }}') {
            throw "Downloads manifest has revision $($manifest.gitCommit), expected ${{ github.sha }}."
          }
          $processes = @(Get-CimInstance Win32_Process | Where-Object {
            $_.Name -eq 'Zommi.exe' -and
            $_.ExecutablePath -and
            [string]::Equals(
              [IO.Path]::GetFullPath($_.ExecutablePath),
              [IO.Path]::GetFullPath($targetExecutable),
              [StringComparison]::OrdinalIgnoreCase)
          })
          if ($processes.Count -ne 1) {
            throw "Expected one delayed exact-path Zommi process, found $($processes.Count)."
          }
          $process = Get-Process -Id $processes[0].ProcessId
          if (-not $process.Responding) {
            throw "Deployed Zommi process $($process.Id) is not responding."
          }
          $coreExecutable = Join-Path $targetDirectory 'zommi-core-host.exe'
          $runtimeDeadline = [DateTime]::UtcNow.AddSeconds(20)
          $coreProcess = $null
          $proxyProcess = $null
          do {
            $snapshot = @(Get-CimInstance Win32_Process)
            $coreProcess = @($snapshot | Where-Object {
              $_.ParentProcessId -eq $process.Id -and
              $_.ExecutablePath -and
              [string]::Equals(
                [IO.Path]::GetFullPath($_.ExecutablePath),
                [IO.Path]::GetFullPath($coreExecutable),
                [StringComparison]::OrdinalIgnoreCase)
            }) | Select-Object -First 1
            if ($null -ne $coreProcess) {
              $proxyProcess = @($snapshot | Where-Object {
                $_.ParentProcessId -eq $coreProcess.ProcessId -and
                $_.ExecutablePath -and
                [string]::Equals(
                  [IO.Path]::GetFullPath($_.ExecutablePath),
                  [IO.Path]::GetFullPath($coreExecutable),
                  [StringComparison]::OrdinalIgnoreCase) -and
                $_.CommandLine -match '(?:^|\s)--wsl-proxy(?:\s|$)'
              }) | Select-Object -First 1
            }
            if ($null -ne $coreProcess -and $null -ne $proxyProcess) { break }
            Start-Sleep -Milliseconds 250
          } while ([DateTime]::UtcNow -lt $runtimeDeadline)
          $cachePath = Join-Path $env:LOCALAPPDATA 'Zommi/runtime-targets.json'
          $cache = Get-Content -LiteralPath $cachePath -Raw | ConvertFrom-Json
          $cachedTarget = $cache.targets | Where-Object {
            $_.executionHost.kind -eq 'wsl' -and $_.executionHost.isDefault
          } | Select-Object -First 1
          $distribution = $cachedTarget.executionHost.name
          if ([string]::IsNullOrWhiteSpace($distribution)) {
            throw 'The deployed runtime cache has no default WSL distribution.'
          }
          $defaultAdapters = @(
            $cache.targets | Where-Object {
              $_.executionHost.kind -eq 'wsl' -and
              $_.executionHost.isDefault -and
              $_.status -eq 'detected'
            } | ForEach-Object { $_.adapterId }
          )
          foreach ($expectedAdapter in @(
            'codex-app-server', 'pi-rpc', 'hermes-acp', 'hermes-gateway',
            'openclaw-acp', 'pty-compatibility'
          )) {
            if ($defaultAdapters -notcontains $expectedAdapter) {
              throw "The deployed runtime cache did not restore $expectedAdapter. Found: $($defaultAdapters -join ', ')."
            }
          }
          $probe = [Diagnostics.ProcessStartInfo]::new()
          $probe.FileName = $coreExecutable
          $probe.UseShellExecute = $false
          $probe.CreateNoWindow = $true
          $probe.RedirectStandardInput = $true
          $probe.RedirectStandardOutput = $true
          $probe.RedirectStandardError = $true
          foreach ($argument in @(
            '--wsl-proxy', '--distribution', $distribution,
            '--cwd', '/', '--', '/bin/sh', '-c',
            'printf ZOMMI_WINDOWS_WSL_RELAY_OK'
          )) {
            $probe.ArgumentList.Add($argument)
          }
          $probeProcess = [Diagnostics.Process]::Start($probe)
          $probeProcess.StandardInput.Close()
          if (-not $probeProcess.WaitForExit(15000)) {
            $probeProcess.Kill($true)
            throw 'The deployed WSL relay probe timed out.'
          }
          $probeOutput = $probeProcess.StandardOutput.ReadToEnd()
          $probeError = $probeProcess.StandardError.ReadToEnd()
          if ($probeProcess.ExitCode -ne 0 -or $probeOutput.Trim() -ne 'ZOMMI_WINDOWS_WSL_RELAY_OK') {
            throw "The deployed WSL relay probe failed ($($probeProcess.ExitCode)): $probeError"
          }
          Write-Host "Persistent WSL relay probe succeeded for $distribution."
          $runtimeExecutable = $cachedTarget.executablePath
          $runtimeHome = $cachedTarget.runtimeHome
          if ([string]::IsNullOrWhiteSpace($runtimeExecutable) -or -not $runtimeExecutable.StartsWith('/')) {
            throw 'The deployed runtime cache has no absolute Codex executable.'
          }
          if ([string]::IsNullOrWhiteSpace($runtimeHome) -or -not $runtimeHome.StartsWith('/')) {
            throw 'The deployed runtime cache has no absolute runtime home.'
          }
          $handshake = [Diagnostics.ProcessStartInfo]::new()
          $handshake.FileName = $coreExecutable
          $handshake.UseShellExecute = $false
          $handshake.CreateNoWindow = $true
          $handshake.RedirectStandardInput = $true
          $handshake.RedirectStandardOutput = $true
          $handshake.RedirectStandardError = $true
          foreach ($argument in @(
            '--wsl-proxy', '--distribution', $distribution,
            '--cwd', $runtimeHome, '--', '/usr/bin/env',
            'ZOMMI_RUNTIME_CHILD=1', $runtimeExecutable, 'app-server'
          )) {
            $handshake.ArgumentList.Add($argument)
          }
          $handshakeProcess = [Diagnostics.Process]::Start($handshake)
          $initialize = [ordered]@{
            id = 1
            method = 'initialize'
            params = [ordered]@{
              clientInfo = [ordered]@{
                name = 'zommi-windows-release-gate'
                title = 'Zommi Windows Release Gate'
                version = '0.1.0'
              }
            }
          } | ConvertTo-Json -Compress -Depth 5
          $handshakeProcess.StandardInput.WriteLine($initialize)
          $handshakeProcess.StandardInput.Flush()
          $responseTask = $handshakeProcess.StandardOutput.ReadLineAsync()
          if (-not $responseTask.Wait(20000)) {
            $handshakeProcess.Kill($true)
            $handshakeProcess.WaitForExit()
            $handshakeError = $handshakeProcess.StandardError.ReadToEnd()
            throw "Codex app-server initialize timed out: $handshakeError"
          }
          $responseLine = $responseTask.Result
          $handshakeProcess.StandardInput.Close()
          if (-not $handshakeProcess.WaitForExit(5000)) {
            $handshakeProcess.Kill($true)
            $handshakeProcess.WaitForExit()
          }
          $handshakeError = $handshakeProcess.StandardError.ReadToEnd()
          try {
            $initializeResponse = $responseLine | ConvertFrom-Json
          } catch {
            throw "Codex app-server initialize returned invalid JSON: $responseLine $handshakeError"
          }
          if ($initializeResponse.id -ne 1 -or [string]::IsNullOrWhiteSpace($initializeResponse.result.userAgent)) {
            throw "Codex app-server initialize was rejected: $responseLine $handshakeError"
          }
          Write-Host "Codex app-server initialize succeeded through the shared WSL spool."
          if ($null -eq $coreProcess) {
            throw 'The deployed Flutter process did not retain its adjacent Rust core host.'
          }
          if ($null -eq $proxyProcess) {
            throw 'The deployed Rust core did not establish its persistent WSL runtime proxy.'
          }
          [ordered]@{
            gitCommit = $manifest.gitCommit
            processId = $process.Id
            processCount = $processes.Count
            responding = $process.Responding
            coreProcessId = $coreProcess.ProcessId
            proxyProcessId = $proxyProcess.ProcessId
            wslDistribution = $distribution
            runtimeAdapters = $defaultAdapters
            relayProbe = $probeOutput.Trim()
            codexInitialize = $initializeResponse.result.userAgent
          } | ConvertTo-Json

  release_macos:
    name: Native release (macOS, temporarily skipped)
    needs: test
    # User-approved boundary on 2026-08-31: no local macOS builder is available.
    # Keep the native job visible as skipped instead of scheduling a hosted runner.
    if: ${{ false }}
    runs-on: [self-hosted, macOS, zommi-release]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Build and verify macOS release
        env:
          ZOMMI_MACOS_SIGNING_IDENTITY: ${{ secrets.ZOMMI_MACOS_SIGNING_IDENTITY }}
        run: bash scripts/package-unix.sh macos

      - name: Upload native release
        uses: actions/upload-artifact@v7
        with:
          name: zommi-macos-${{ runner.arch }}-${{ github.sha }}
          path: |
            artifacts/zommi-macos-*.zip
            artifacts/zommi-macos-*.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
