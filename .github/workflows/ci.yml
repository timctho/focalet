name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Flutter and Rust contracts
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, X64, zommi-ci]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: clippy,rustfmt

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Set up .NET capture build
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.tool_cache }}/dotnet
        with:
          dotnet-version: 8.0.x

      - name: Check Rust core
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --all-targets
          cargo build --workspace --bins

      - name: Restore Flutter dependencies
        working-directory: src/Zommi.Flutter
        run: flutter pub get

      - name: Analyze and test Flutter UI
        working-directory: src/Zommi.Flutter
        run: |
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Test release package contracts
        run: |
          python3 -m py_compile scripts/assemble_release.py scripts/verify_release.py tests/test_release_package.py
          python3 tests/test_release_package.py -v
          python3 tests/test_linux_startup_smoke.py -v
          bash -n scripts/package-unix.sh scripts/package-linux-self-hosted.sh scripts/smoke-linux-release.sh

      - name: Build Windows capture helper
        run: |
          dotnet run --project tests/Zommi.Capture.Tests/Zommi.Capture.Tests.csproj --configuration Release
          dotnet build src/Zommi.Windows/Zommi.Windows.csproj --configuration Release

  release_linux:
    name: Native release (linux)
    needs: test
    runs-on: [self-hosted, Linux, X64, zommi-release]
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Build and verify Linux release
        env:
          ZOMMI_LINUX_STARTUP_SMOKE: '1'
        run: bash scripts/package-linux-self-hosted.sh

      - name: Show release identity and signing state
        run: |
          python -c "import glob,json; p=glob.glob('artifacts/zommi-*/release-manifest.json'); assert len(p)==1, p; print(json.dumps(json.load(open(p[0], encoding='utf-8')), indent=2))"

      - name: Upload native release
        uses: actions/upload-artifact@v7
        with:
          name: zommi-linux-${{ runner.arch }}-${{ github.sha }}
          path: |
            artifacts/zommi-linux-*.tar.gz
            artifacts/zommi-linux-*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release_hosted:
    name: Native release (${{ matrix.target }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows
          - os: macos-15
            target: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Ensure Windows ATL build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vs_installer.exe'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ([string]::IsNullOrWhiteSpace($installPath)) { throw 'Visual Studio C++ tools were not found.' }
          & $installer modify --installPath $installPath --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart
          if ($LASTEXITCODE -notin @(0, 3010)) { throw "Visual Studio ATL installation failed with $LASTEXITCODE." }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.93.0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true

      - name: Set up .NET capture publisher
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Build and verify macOS release
        if: runner.os == 'macOS'
        env:
          ZOMMI_MACOS_SIGNING_IDENTITY: ${{ secrets.ZOMMI_MACOS_SIGNING_IDENTITY }}
        run: bash scripts/package-unix.sh macos

      - name: Build and verify Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ZOMMI_WINDOWS_SIGNING_THUMBPRINT: ${{ secrets.ZOMMI_WINDOWS_SIGNING_THUMBPRINT }}
        run: ./scripts/package-windows.ps1 -Runtime win-x64

      - name: Show release identity and signing state
        shell: bash
        run: |
          python -c "import glob,json; p=glob.glob('artifacts/zommi-*/release-manifest.json'); assert len(p)==1, p; print(json.dumps(json.load(open(p[0], encoding='utf-8')), indent=2))"

      - name: Upload native release
        uses: actions/upload-artifact@v7
        with:
          name: zommi-${{ matrix.target }}-${{ runner.arch }}-${{ github.sha }}
          path: |
            artifacts/zommi-${{ matrix.target }}-*.zip
            artifacts/zommi-${{ matrix.target }}-*.zip.sha256
            artifacts/zommi-${{ matrix.target }}-*.tar.gz
            artifacts/zommi-${{ matrix.target }}-*.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
