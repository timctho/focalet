name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Forks run only on disposable GitHub-hosted machines, without deployment keys.
permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation:
    name: Documentation and CI policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      desktop_required: ${{ steps.scope.outputs.desktop_required }}
      capture_required: ${{ steps.scope.outputs.capture_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Select required checks
        id: scope
        run: python scripts/ci_scope.py
      - name: Install documentation tools
        run: python -m pip install -r requirements-docs.txt
      - name: Check documentation and CI boundaries
        run: |
          python scripts/check_docs.py
          python -m unittest discover -s tests -p test_ci_scope.py -v
          python -m unittest discover -s tests -p test_product_boundaries.py -v
          python -m unittest discover -s tests -p test_branding.py -v
          python -m unittest discover -s tests -p test_contributor_checks.py -v
          python -m unittest discover -s tests -p test_release_workflow.py -v
      - name: Verify changed demo media
        if: steps.scope.outputs.demos_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install Pillow==11.3.0
          python scripts/verify_demo_assets.py

  contracts:
    needs: documentation
    if: needs.documentation.outputs.desktop_required == 'true'
    name: Linux contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@283fb51ee3c8a49cd7c8ff30102f3fcf3cfbe0e1 # 1.93.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: native-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ runner.arch }}-3.47.2
          pub-cache-key: pub-${{ runner.os }}-${{ runner.arch }}-3.47.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - name: Install native test dependencies
        run: |
          sudo apt-get update
          # Keep the native GNOME test dependencies without optional desktop apps and wallpapers.
          sudo apt-get install --no-install-recommends -y binutils libsqlite3-dev libgtk-3-dev libwebkit2gtk-4.1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-pipewire gstreamer1.0-plugins-base libepoxy-dev libayatana-appindicator3-dev libx11-dev clang cmake ninja-build pkg-config libasound2t64 ffmpeg dbus-x11 at-spi2-core dconf-gsettings-backend libgl1-mesa-dri gnome-shell xdg-desktop-portal-gnome pipewire wireplumber python3-pil python3-pyatspi python3-gi gir1.2-gtk-3.0 gir1.2-gtk-4.0
          python -m pip install -r tests/requirements.txt
      - name: Check all contracts, widgets, processes and browser capture
        env:
          FOCALET_TEST_CHROMIUM: /usr/bin/google-chrome
        run: python scripts/check.py
      - name: Install pinned Gemini and Claude CLIs for integration tests
        run: |
          npm ci --prefix tests/runtime-clis --ignore-scripts --no-audit --no-fund
          node tests/runtime-clis/node_modules/@anthropic-ai/claude-code/install.cjs
      - name: Verify real agent CLIs without accounts or external network
        run: |
          sudo --preserve-env=PATH unshare --net -- bash -c 'ip link set lo up; exec runuser -u "$SUDO_USER" --preserve-environment -- python3 scripts/verify-runtime-clis.py'
      - name: Compile and verify the Linux desktop package
        run: bash scripts/package-unix.sh linux
      - name: Verify GNOME Wayland capture, context and recovery
        run: /usr/bin/python3 scripts/accept-linux-wayland.py --package artifacts/focalet-linux-x64 --browser /usr/bin/google-chrome
      - name: Ensure checks did not rewrite committed files
        run: git diff --exit-code
      - name: Save failed synthetic Wayland acceptance
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wayland-failures-${{ github.sha }}
          path: artifacts/wayland-acceptance/
          if-no-files-found: ignore
          retention-days: 3
      - name: Save failed UI comparisons
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-failures-linux-${{ github.sha }}
          path: src/Focalet.Flutter/test/failures/*.png
          if-no-files-found: ignore
          retention-days: 3

  capture_windows:
    needs: documentation
    if: needs.documentation.outputs.capture_required == 'true'
    name: Capture contracts (Windows)
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Check shared capture and both Windows consumers
        run: python scripts/check.py --suite capture
      - name: Verify standalone capture batch paste on native editors
        # Exercise Electron's main-process clipboard.readImage as well as DOM paste.
        # The fixture uses a fresh profile and synthetic content without agent accounts.
        run: |
          npm ci --prefix tests/clipboard-electron --ignore-scripts --no-audit --no-fund
          node tests/clipboard-electron/node_modules/electron/install.js
          dotnet run --project tests/Focalet.Windows.Tests --configuration Release -- --paste-acceptance
      - name: Verify capture source context after selection and hover
        run: ./scripts/accept-windows-annotations.ps1 -CaptureHost ./src/Focalet.Windows/bin/Release/net8.0-windows10.0.19041.0/Focalet.CaptureHost.exe -OutputDirectory ./artifacts/capture-annotations
      - name: Retain failed capture paste evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: capture-paste-failure-${{ github.sha }}
          path: artifacts/capture-*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Build and verify standalone capture tool
        run: |
          ./scripts/package-capture-tool.ps1
          python scripts/verify_capture_package.py artifacts/focalet-capture-win-x64 --expected-commit $env:GITHUB_SHA --smoke
          if ($LASTEXITCODE -ne 0) { throw 'Capture package verification failed' }
      - name: Build and accept the independent Capture installer
        shell: pwsh
        run: |
          python scripts/package_capture.py windows
          if ($LASTEXITCODE -ne 0) { throw 'Capture package failed' }
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (-not (Test-Path $compiler)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          python scripts/build_capture_installer.py artifacts/focalet-capture-win-x64 --expected-commit $env:GITHUB_SHA --output artifacts/capture-installers --makensis $compiler
          if ($LASTEXITCODE -ne 0) { throw 'Capture installer failed' }
          python scripts/accept_capture_windows_installer.py artifacts/capture-installers/Focalet-Capture-Setup-x64.exe --expected-commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Capture installer acceptance failed' }
      - name: Retain Focalet Capture package and paste acceptance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: capture-tool-windows-${{ github.sha }}
          path: |
            artifacts/focalet-capture-win-x64.zip
            artifacts/capture-paste-acceptance.png
            artifacts/capture-native-clipboard.png
            artifacts/capture-browser-paste.png
            artifacts/capture-electron-*.png
            artifacts/capture-annotations/toolbar-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Ensure checks did not rewrite committed files
        run: git diff --exit-code

  capture_unix:
    needs: documentation
    if: needs.documentation.outputs.capture_required == 'true'
    name: Capture contracts (${{ matrix.platform }} ${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: x64
            runtime: linux-x64
            os: ubuntu-24.04
          - platform: macos
            architecture: arm64
            runtime: osx-arm64
            os: macos-15
          - platform: macos
            architecture: x64
            runtime: osx-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '4'
      CAPTURE_PLATFORM: ${{ matrix.platform }}
      CAPTURE_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@283fb51ee3c8a49cd7c8ff30102f3fcf3cfbe0e1 # 1.93.0
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: runner.os == 'Linux'
        with:
          shared-key: native-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install native GNOME build and acceptance dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-pipewire gstreamer1.0-plugins-base dpkg-dev desktop-file-utils dbus-x11 at-spi2-core dconf-gsettings-backend libgl1-mesa-dri gnome-shell xdg-desktop-portal-gnome pipewire wireplumber python3-pil python3-pyatspi python3-gi python3-gi-cairo gir1.2-atspi-2.0 gir1.2-gtk-3.0
      - name: Check ordered payloads and context alignment
        run: python3 -m unittest discover -s tests -p test_capture_unix.py -v
      - name: Build and verify independent Capture package and installer
        run: |
          python3 scripts/package_capture.py "$CAPTURE_PLATFORM"
          python3 scripts/verify_capture_package.py "artifacts/focalet-capture-$CAPTURE_RUNTIME" --expected-commit "$GITHUB_SHA"
          python3 scripts/build_capture_installer.py "artifacts/focalet-capture-$CAPTURE_RUNTIME" --expected-commit "$GITHUB_SHA" --output artifacts/capture-installers
      - name: Verify native macOS clipboard and selection geometry
        if: runner.os == 'macOS'
        run: |
          python3 scripts/verify_capture_package.py "artifacts/focalet-capture-$CAPTURE_RUNTIME" --expected-commit "$GITHUB_SHA" --smoke
          xcrun swiftc -swift-version 5 src/Focalet.Capture.Mac/MacRegionSelector.swift scripts/test-macos-region-selection.swift -o /tmp/focalet-capture-geometry
          /tmp/focalet-capture-geometry
      - name: Install and accept Capture on disposable GNOME
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install --no-install-recommends -y ./artifacts/capture-installers/Focalet-Capture-Ubuntu-amd64.deb
          /usr/bin/python3 scripts/accept-linux-capture.py --package /opt/focalet-capture
          sudo apt-get remove -y focalet-capture
          test ! -e /usr/bin/focalet-capture
      - name: Retain failed synthetic Capture evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: capture-unix-failure-${{ matrix.runtime }}-${{ github.sha }}
          path: artifacts/capture-wayland/
          if-no-files-found: ignore
          retention-days: 3
      - name: Ensure checks did not rewrite source
        run: git diff --exit-code

  windows:
    needs: documentation
    if: needs.documentation.outputs.desktop_required == 'true'
    name: Windows contracts
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - uses: dtolnay/rust-toolchain@283fb51ee3c8a49cd7c8ff30102f3fcf3cfbe0e1 # 1.93.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: native-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ runner.arch }}-3.47.2
          pub-cache-key: pub-${{ runner.os }}-${{ runner.arch }}-3.47.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check Windows process, path, SQLite and capture contracts
        run: python scripts/check.py --suite windows
      - name: Compile and verify the Windows desktop package
        run: ./scripts/package-windows.ps1 -Runtime win-x64
      - name: Compile and verify the Windows installer
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          if (-not (Test-Path $compiler)) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          python scripts/build_installer.py artifacts/focalet-windows-x64 --expected-commit $env:GITHUB_SHA --output artifacts/installers --makensis $compiler
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer failed' }
      - name: Ensure checks did not rewrite committed files
        run: git diff --exit-code
      - name: Save failed UI comparisons
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-failures-windows-${{ github.sha }}
          path: src/Focalet.Flutter/test/failures/*.png
          if-no-files-found: ignore
          retention-days: 3

  macos:
    needs: documentation
    if: needs.documentation.outputs.desktop_required == 'true'
    name: macOS contracts (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            os: macos-15
          - architecture: x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@283fb51ee3c8a49cd7c8ff30102f3fcf3cfbe0e1 # 1.93.0
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: native-${{ runner.os }}-${{ runner.arch }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ runner.arch }}-3.47.2
          pub-cache-key: pub-${{ runner.os }}-${{ runner.arch }}-3.47.2
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 8.0.x
      - name: Check core, Flutter and macOS golden contracts
        run: python3 scripts/check.py --suite rust --suite flutter
      - name: Verify agent startup and recovery on macOS
        run: |
          python3 -m unittest discover -s tests -p test_claude_runtime.py -v
          python3 -m unittest discover -s tests -p test_acp_startup.py -v
      - name: Test native macOS selection geometry
        run: |
          xcrun swiftc -swift-version 5 \
            src/Focalet.Capture.Mac/MacRegionSelector.swift \
            scripts/test-macos-region-selection.swift \
            -o /tmp/focalet-macos-region-tests
          /tmp/focalet-macos-region-tests
      - name: Install locked CocoaPods version
        run: sudo gem install cocoapods --version 1.17.0 --no-document
      - name: Compile and verify the macOS desktop package
        run: bash scripts/package-unix.sh macos
      - name: Ensure checks did not rewrite committed files
        run: git diff --exit-code
      - name: Save failed UI comparisons
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: golden-failures-macos-${{ matrix.architecture }}-${{ github.sha }}
          path: src/Focalet.Flutter/test/failures/*.png
          if-no-files-found: ignore
          retention-days: 3

  required:
    name: PR checks passed
    if: always()
    needs: [documentation, contracts, windows, macos, capture_windows, capture_unix]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require documentation and every applicable platform to pass
        env:
          DOCS_RESULT: ${{ needs.documentation.result }}
          DESKTOP_REQUIRED: ${{ needs.documentation.outputs.desktop_required }}
          CAPTURE_REQUIRED: ${{ needs.documentation.outputs.capture_required }}
          CAPTURE_UNIX_RESULT: ${{ needs.capture_unix.result }}
          CAPTURE_RESULT: ${{ needs.capture_windows.result }}
          LINUX_RESULT: ${{ needs.contracts.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          test "$DOCS_RESULT" = success || exit 1
          if [ "$DESKTOP_REQUIRED" = true ]; then
            test "$LINUX_RESULT" = success && test "$WINDOWS_RESULT" = success && test "$MACOS_RESULT" = success || exit 1
          elif [ "$DESKTOP_REQUIRED" = false ]; then
            test "$LINUX_RESULT" = skipped && test "$WINDOWS_RESULT" = skipped && test "$MACOS_RESULT" = skipped || exit 1
          else
            exit 1
          fi
          if [ "$CAPTURE_REQUIRED" = true ]; then
            test "$CAPTURE_RESULT" = success && test "$CAPTURE_UNIX_RESULT" = success
          elif [ "$CAPTURE_REQUIRED" = false ]; then
            test "$CAPTURE_RESULT" = skipped && test "$CAPTURE_UNIX_RESULT" = skipped
          else
            exit 1
          fi
