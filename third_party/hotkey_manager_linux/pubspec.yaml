name: hotkey_manager_linux
description: Focalet's X11 implementation of the hotkey_manager Linux plugin.
version: 0.2.0+focalet.1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  hotkey_manager_platform_interface: ^0.2.0

flutter:
  plugin:
    implements: hotkey_manager
    platforms:
      linux:
        pluginClass: HotkeyManagerLinuxPlugin
