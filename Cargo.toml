[workspace]
members = [
    "crates/zommi-core",
    "crates/zommi-core-host",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
base64 = "0.22.1"
regex = "1.11.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha2 = "0.10.9"
thiserror = "2.0.18"
uuid = { version = "1.20.0", features = ["v4"] }
