[workspace]
members = [
    "crates/zommi-core",
    "crates/zommi-core-host",
    "crates/zommi-linux-capture",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/timctho/zommi"

[workspace.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["screencast", "tokio"] }
base64 = "0.22.1"
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
futures-util = "0.3.31"
rand_core = { version = "0.6.4", features = ["getrandom"] }
regex = "1.11.3"
png = "0.18.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.28.0", features = ["rustls-tls-native-roots"] }
url = "2.5.7"
uuid = { version = "1.20.0", features = ["v4"] }
wait-timeout = "0.2.1"
