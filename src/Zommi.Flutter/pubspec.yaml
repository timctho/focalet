name: zommi_flutter
description: Zommi's cross-platform floating UI.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_html: ^3.0.0
  flutter_markdown_plus: ^1.0.12
  flutter_local_notifications: ^22.3.1
  file_selector: ^1.0.3
  hotkey_manager: ^0.2.3
  html: 0.15.6
  markdown: ^7.3.1
  screen_capturer: ^0.2.3
  screen_retriever: ^0.2.2
  super_clipboard: ^0.9.1
  tray_manager: ^0.5.3
  url_launcher: ^6.3.2
  window_manager: ^0.5.2
  sqlite3: ^3.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  hotkey_manager_linux:
    path: ../../third_party/hotkey_manager_linux

# Use OS SQLite on Windows/macOS; Linux packaging includes the build host's
# library to preserve its glibc baseline (the upstream prebuilt requires 2.33).
hooks:
  user_defines:
    sqlite3:
      source: system
      name: sqlite3
      name_windows: winsqlite3

flutter:
  uses-material-design: true
  assets:
    - assets/runtime_icons/
    - macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_32.png
    - windows/runner/resources/app_icon.ico
