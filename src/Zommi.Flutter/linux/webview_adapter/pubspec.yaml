name: flutter_inappwebview_linux
description: Zommi registration adapter for its native WebKitGTK document surface.
version: 0.1.0-beta.1
publish_to: none
environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    implements: flutter_inappwebview
    platforms:
      linux:
        dartPluginClass: LinuxInAppWebViewPlatform
